<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>SPX Barcode Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#f97316;color:#fff;padding:18px 16px}h1{font-size:21px;margin:0 0 5px}header p{font-size:13px;margin:0}
main{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #0000000c}
video{display:block;width:100%;max-height:58vh;min-height:230px;background:#111;border-radius:10px;object-fit:cover}
button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#f97316;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.success{background:#16a34a;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1;min-height:46px}
#status{font-size:14px;line-height:1.5;margin-bottom:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.sn{font-size:20px;font-weight:700;overflow-wrap:anywhere;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:12px;min-height:48px}
.small{font-size:12px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<header><h1>📦 SPX Barcode Scanner</h1><p>Pemindai barcode/QR di halaman HTTPS terpisah</p></header>
<main>
<section class="card">
<div id="status" role="status" aria-live="polite">Tekan “Mulai scan”, lalu izinkan akses kamera.</div>
<video id="video" autoplay muted playsinline></video>
<div class="row">
<button id="start" class="primary">Mulai scan</button>
<button id="stop" class="secondary">Tutup kamera</button>
</div>
</section>
<section class="card">
<strong>SN terbaca</strong>
<div id="result" class="sn" style="margin-top:9px">Belum ada hasil</div>
<div class="row">
<button id="rescan" class="secondary">Scan ulang</button>
<button id="return" class="success">Kirim SN ke aplikasi</button>
</div>
<p class="small">Jika halaman dibuka dari aplikasi SPX, SN akan dikirim ke URL kembali yang diberikan aplikasi. Jika tidak, SN tetap bisa disalin manual.</p>
</section>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const returnRaw = params.get('return') || '';
let returnUrl = null;
try {
  if (returnRaw) {
    const candidate = new URL(returnRaw);
    // Hanya izinkan URL HTTPS untuk tujuan kembali.
    if (candidate.protocol === 'https:') returnUrl = candidate;
  }
} catch (_) {}

let reader = null;
let controls = null;
let stream = null;
let scanning = false;
let loadingPromise = null;
let scanned = '';

function status(text) { $('status').textContent = text; }

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = url;
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => {
      script.remove();
      reject(new Error('Gagal memuat ' + url));
    };
    document.head.appendChild(script);
  });
}

// Coba beberapa CDN secara berurutan, bukan bergantung pada satu alamat.
async function loadZXing() {
  if (window.ZXing && window.ZXing.BrowserMultiFormatReader) return window.ZXing;
  if (loadingPromise) return loadingPromise;

  loadingPromise = (async () => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
      'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/zxing/0.21.3/zxing.min.js'
    ];
    let lastError;
    for (const url of urls) {
      try {
        status('Memuat library scanner...\n' + url);
        await loadScript(url);
        if (window.ZXing && window.ZXing.BrowserMultiFormatReader) return window.ZXing;
        lastError = new Error('File dimuat, tetapi objek ZXing tidak ditemukan.');
      } catch (e) {
        lastError = e;
      }
    }
    loadingPromise = null;
    throw lastError || new Error('Semua CDN scanner gagal dimuat.');
  })();
  return loadingPromise;
}

async function stop() {
  scanning = false;
  try { if (controls && typeof controls.stop === 'function') controls.stop(); } catch (_) {}
  controls = null;
  try { if (reader && typeof reader.reset === 'function') reader.reset(); } catch (_) {}
  reader = null;
  if (stream) {
    try { stream.getTracks().forEach(track => track.stop()); } catch (_) {}
    stream = null;
  }
  const video = $('video');
  if (video.srcObject) {
    try { video.srcObject.getTracks().forEach(track => track.stop()); } catch (_) {}
    video.srcObject = null;
  }
}

async function start() {
  await stop();
  scanned = '';
  $('result').textContent = 'Belum ada hasil';
  $('start').disabled = true;
  $('rescan').disabled = true;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status('Browser tidak mendukung kamera. Buka halaman GitHub Pages langsung melalui HTTPS di Chrome.');
    $('start').disabled = false;
    $('rescan').disabled = false;
    return;
  }

  try {
    status('Memuat library barcode...');
    const ZXing = await loadZXing();
    // Prioritaskan pembacaan barcode umum dengan mode TRY_HARDER dan jeda scan singkat.
    const hints = new Map();
    if (ZXing.DecodeHintType && ZXing.DecodeHintType.TRY_HARDER) {
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    }
    if (ZXing.DecodeHintType && ZXing.DecodeHintType.POSSIBLE_FORMATS && ZXing.BarcodeFormat) {
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93, ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODABAR
      ].filter(Boolean));
    }
    // Scan ulang tiap 80 ms agar respons lebih cepat, tanpa mengunci format SN tertentu.
    reader = new ZXing.BrowserMultiFormatReader(hints, 80);

    status('Meminta izin kamera...');
    // decodeFromVideoDevice memilih kamera belakang bila tersedia.
    controls = await reader.decodeFromVideoDevice(
      undefined,
      $('video'),
      (result, error, callbackControls) => {
        if (!scanning || !result || scanned) return;
        const value = String(result.getText ? result.getText() : '').trim();
        if (!value) return;
        scanned = value;
        $('result').textContent = value;
        status('Barcode berhasil dibaca. Tekan “Kirim SN ke aplikasi”.');
        if (callbackControls && typeof callbackControls.stop === 'function') {
          try { callbackControls.stop(); } catch (_) {}
        }
        controls = null;
        scanning = false;
      }
    );
    scanning = true;
    // Minta resolusi lebih tinggi dan autofocus kontinu jika kamera mendukungnya.
    const videoTrack = $('video').srcObject && $('video').srcObject.getVideoTracks()[0];
    if (videoTrack && videoTrack.applyConstraints) {
      try {
        const advanced = [];
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
          advanced.push({focusMode:'continuous'});
        }
        await videoTrack.applyConstraints({
          width:{ideal:1280}, height:{ideal:720},
          ...(advanced.length ? {advanced} : {})
        });
      } catch (constraintError) {
        console.debug('Kamera tidak mendukung pengaturan fokus/resolusi tambahan.', constraintError);
      }
    }
    status('Kamera aktif. Dekatkan barcode, pastikan fokus tajam, lalu tahan sebentar.');
  } catch (e) {
    await stop();
    const detail = (e && (e.name || e.message)) ? ((e.name ? e.name + ': ' : '') + (e.message || '')) : String(e);
    status('Scanner gagal dijalankan.\n' + detail + '\n\nPastikan koneksi internet aktif, buka GitHub Pages langsung di Chrome, lalu izinkan akses kamera. Jika library gagal dimuat, coba jaringan lain atau matikan pemblokir konten.');
  } finally {
    $('start').disabled = false;
    $('rescan').disabled = false;
  }
}

function sendBack() {
  if (!scanned) {
    status('Belum ada SN yang terbaca. Tekan “Mulai scan” terlebih dahulu.');
    return;
  }
  if (!returnUrl) {
    status('SN terbaca: ' + scanned + '\nParameter URL kembali tidak tersedia. Salin SN ini secara manual atau buka scanner dari tombol di aplikasi.');
    return;
  }
  returnUrl.searchParams.set('scannedSN', scanned);
  returnUrl.searchParams.set('scannerReturn', '1');
  status('Mengirim SN kembali ke aplikasi...');
  location.href = returnUrl.toString();
}

$('start').addEventListener('click', start);
$('rescan').addEventListener('click', start);
$('stop').addEventListener('click', async () => {
  await stop();
  status('Kamera ditutup.');
});
$('return').addEventListener('click', sendBack);
window.addEventListener('pagehide', () => { stop(); });
})();
</script>
</body>
</html>
